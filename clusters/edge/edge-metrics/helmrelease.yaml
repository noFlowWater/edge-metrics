apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: edge-metrics
  namespace: monitoring
spec:
  interval: 5m
  url: oci://ghcr.io/noflowwater/charts/edge-metrics
  ref:
    semver: ">=0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-metrics
  namespace: monitoring
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: edge-metrics
  values:
    server:
      persistence:
        enabled: true
        size: 512Mi
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
    exporter:
      profiles:
        jetson:
          enabled: true
        generic:
          enabled: true
      serviceMonitor:
        enabled: true
    frontend:
      enabled: true
  valuesFrom:
    - kind: ConfigMap
      name: edge-metrics-values
      optional: true
    - kind: Secret
      name: edge-metrics-secrets
      optional: true
