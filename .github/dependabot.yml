version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: monthly
    labels:
      - dependencies
      - go

  - package-ecosystem: pip
    directory: /exporter
    schedule:
      interval: monthly
    labels:
      - dependencies
      - python

  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: monthly
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
