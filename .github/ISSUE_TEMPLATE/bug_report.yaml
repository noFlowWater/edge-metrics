name: Bug Report
description: Report a bug in Edge Metrics
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
  - type: input
    id: version
    attributes:
      label: Version
      description: Chart/image version
      placeholder: "0.1.0"
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server
        - Exporter
        - Frontend
        - Helm Chart
