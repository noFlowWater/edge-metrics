name: Build Dev Images

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "exporter/**"
      - "front/**"

permissions:
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: noflowwater

jobs:
  build-dev:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: server
            image: edge-metrics-server
          - context: exporter
            image: edge-metrics-exporter
          - context: front
            image: edge-metrics-front
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
