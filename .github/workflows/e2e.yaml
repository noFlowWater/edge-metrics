name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e-test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster and build images
        run: bash e2e/setup.sh

      - name: Helm install and smoke test
        run: bash e2e/test_install.sh

      - name: Run e2e tests
        run: bash e2e/test_device_lifecycle.sh

      - name: Teardown
        if: always()
        run: bash e2e/teardown.sh
