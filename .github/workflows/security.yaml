name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am UTC

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io
  OWNER: noflowwater

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: server
            image: edge-metrics-server
          - context: exporter
            image: edge-metrics-exporter
          - context: front
            image: edge-metrics-front
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ matrix.image }}:scan ${{ matrix.context }}/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif

  helm-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin/

      - name: Validate manifests (strict)
        run: |
          helm template test charts/edge-metrics -f charts/edge-metrics/values-prod.yaml | \
            kubeconform -strict -ignore-missing-schemas -summary
