apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-metrics-exporter-generic
  namespace: monitoring
  labels:
    app: edge-metrics-exporter-generic
spec:
  selector:
    matchLabels:
      app: edge-metrics-exporter-generic
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: edge-metrics-exporter-generic
    spec:
      nodeSelector:
        device-family: generic
      tolerations:
        - key: node-role.kubernetes.io/edge
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: exporter
          image: edge-metrics-exporter:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9102
            - name: management
              containerPort: 9101
            - name: shelly-ws
              containerPort: 8765
            - name: shelly-http
              containerPort: 8766
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONFIG_SERVER_URL
              value: "http://edge-metrics-server.monitoring.svc.cluster.local:8081"
            - name: CONFIG_TIMEOUT
              value: "5"
            - name: LOCAL_CONFIG_PATH
              value: "/config/config.yaml"
            - name: SHELLY_ENABLED
              value: "true"
          volumeMounts:
            - name: config-dir
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /health
              port: 9101
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9101
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: config-dir
          hostPath:
            path: /var/lib/edge-metrics
            type: DirectoryOrCreate
